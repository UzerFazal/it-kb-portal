{% extends "base/layout.html" %}
{% block title %}Sign In — IT Knowledge Base{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 48px - 48px);display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:52px;height:52px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <svg width="26" height="26" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      </div>
      <h1 style="font-size:20px;font-weight:600;color:var(--text-primary);">IT Knowledge Base</h1>
      <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">Sign in with your corporate account</p>
    </div>
    <div class="card">
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger mb-4">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" type="text" name="username" autocomplete="username" required placeholder="Enter your username"/>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" name="password" autocomplete="current-password" required placeholder="••••••••"/>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;height:38px;">
            Sign In
          </button>
        </form>
      </div>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;">
      For access issues contact IT Support
    </p>
  </div>
</div>
{% endblock %}
